name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  BEND_NO_TELEMETRY: "1"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
          rustup target list --installed | grep -qx wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Bend
        env:
          BEND_VERSION: 2.0.40
          BEND_SHA256: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
        run: |
          archive="$RUNNER_TEMP/bend.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/bendlang/bend/releases/download/v${BEND_VERSION}/bend-${BEND_VERSION}-linux-x64.tar.gz"
          echo "${BEND_SHA256}  ${archive}" | sha256sum --check --strict
          unpacked="$RUNNER_TEMP/bend-unpacked"
          mkdir -p "$unpacked"
          tar -xzf "$archive" -C "$unpacked"
          bend_home="$HOME/.bend"
          mkdir -p "$bend_home/bin"
          mv "$unpacked/bend/bin/bend" "$bend_home/bin/bend"
          mv "$unpacked/bend/bend2" "$unpacked/bend/guide" "$bend_home/"
          echo "BEND_HOME=$bend_home" >> "$GITHUB_ENV"
          echo "$bend_home/bin" >> "$GITHUB_PATH"
          "$bend_home/bin/bend" version

      - name: Install Lean
        env:
          ELAN_VERSION: 4.4.0
          ELAN_SHA256: 0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2
          LEAN_TOOLCHAIN: leanprover/lean4:v4.34.0
        run: |
          archive="$RUNNER_TEMP/elan.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/leanprover/elan/releases/download/v${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain "$LEAN_TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - run: make fmt-check
      - run: make lint
      - run: make test
      - run: make wasm
      - run: make proof
      - run: make lean
      - run: make verdict

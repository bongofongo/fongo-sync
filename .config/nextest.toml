[profile.default]
# A hung test is killed after ten minutes and fails the run, rather than holding it until the job
# times out.
slow-timeout = { period = "60s", terminate-after = 10 }
# A test that passes only when tried again is a failing test.
retries = 0

[[profile.default.overrides]]
filter = 'binary(regressions) & test(=deleting_an_owner_of_many_rows_takes_work_in_proportion)'
slow-timeout = { period = "60s", terminate-after = 3 }

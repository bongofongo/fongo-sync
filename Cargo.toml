[workspace]
resolver = "3"
members = ["crates/client", "crates/core", "crates/protocol", "crates/sqlite"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fongo-sync-core = { path = "crates/core" }
sha2 = "0.10"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ed25519-dalek = "2.2"
getrandom = "0.4"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }
proptest = "1"

# The reference model checks every step of the storage tests; unoptimised, it dominates them.
[profile.dev.package.fongo-sync-core]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3
